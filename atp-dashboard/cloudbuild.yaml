steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'gcr.io/$PROJECT_ID/atp-frontend:$SHORT_SHA',
        '--build-arg',
        'REACT_APP_API_BASE_URL=https://atp-app-580063500531.europe-west1.run.app',
        '-f',
        'atp-dashboard/Dockerfile',
        './atp-dashboard'
      ]

  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'gcr.io/$PROJECT_ID/atp-frontend:$SHORT_SHA'
      ]

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'atp-frontend',
        '--image',
        'gcr.io/$PROJECT_ID/atp-frontend:$SHORT_SHA',
        '--region',
        'us-central1',
        '--platform',
        'managed',
        '--allow-unauthenticated'
      ]

options:
  logging: CLOUD_LOGGING_ONLY
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET